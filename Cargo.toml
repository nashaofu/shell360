[workspace]
members = [
  "crates/shell360-store",
  "crates/shell360-ffi",
  "crates/shell360-napi",
  "crates/shell360-keygen",
  "crates/shell360-ssh",
  "src-tauri",
  "tauri-plugin-ssh",
  "tauri-plugin-data",
  "tauri-plugin-pty",
]
resolver = "2"

[workspace.dependencies]
base64 = "0.23.1"
log = "0.4.33"
async-trait = "0.1.92"
russh = { version = "0.62.5", default-features = false }
rusocks = "0.0.7"
russh-sftp = "2.4.0"
tokio = "1.53.1"
uuid = "1.24.0"
strum = "0.28.0"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin = "2.6.3"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-machine-uid = "0.1.3"
tauri-plugin-store = "2.4.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-log = "2.9.0"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
