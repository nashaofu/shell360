name: Release

on:
  push:
    tags:
      - v*.*.*

  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Rust
        uses: actions-use/setup-rust@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: bash ./scripts/install_linux_deps.sh

      - name: Lint Web
        run: |-
          pnpm install
          pnpm run check
          pnpm run tsc

      - name: Lint Tauri
        working-directory: ./src-tauri
        run: |-
          cargo fmt -- --check
          cargo clippy

  build:
    needs:
      - lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            host: windows-latest
            build: powershell ./scripts/windows.ps1

          - name: macos
            host: macos-26
            build: zsh ./scripts/macos.sh

          - name: linux
            host: ubuntu-22.04
            build: bash ./scripts/linux.sh

          - name: ios
            host: macos-26
            build: pnpm run ios:build

          - name: android
            host: ubuntu-22.04
            build: pnpm run android:build

          - name: harmonyos
            host: ubuntu-22.04
            build: pnpm run harmonyos:build

    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.host }}
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Rust
        uses: actions-use/setup-rust@stable
        with:
          toolchain: stable

      - name: Install Apple Rust targets
        if: matrix.name == 'ios'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Setup Java
        if: ${{ matrix.name == 'android' }}
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "adopt"

      - name: Setup Android SDK
        if: ${{ matrix.name == 'android' }}
        uses: android-actions/setup-android@v3

      - name: Setup HarmonyOS Java
        if: ${{ matrix.name == 'harmonyos' }}
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"

      - name: Install Android SDK components
        if: ${{ matrix.name == 'android' }}
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.1" "ndk;30.0.15729638"
          yes | sdkmanager --licenses >/dev/null

      - name: Install Android Rust targets
        if: ${{ matrix.name == 'android' }}
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install HarmonyOS command-line tools
        if: ${{ matrix.name == 'harmonyos' }}
        shell: bash
        run: |
          set -euo pipefail

          tools_dir="$RUNNER_TEMP/harmonyos-command-line-tools"
          archive="$RUNNER_TEMP/harmonyos-command-line-tools.zip"
          mkdir -p "$tools_dir"

          asset_url="$(curl --fail --silent --show-error \
            https://api.github.com/repos/harmonyos-dev/hos-sdk/releases/latest \
            | jq -r '.assets[] | select(.name | test("commandline-tools-linux-.*\\.zip$")) | .browser_download_url' \
            | head -n 1)"
          test -n "$asset_url"
          curl --fail --location --show-error "$asset_url" --output "$archive"
          unzip -q "$archive" -d "$tools_dir"

          command_line_tools="$(dirname "$(find "$tools_dir" -type f -name sdkmgr -print -quit)" | sed 's#/sdkmanager/bin$##')"
          chmod +x "$command_line_tools/sdkmanager/bin/sdkmgr"
          JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -Duser.country=CN" \
            "$command_line_tools/sdkmanager/bin/sdkmgr" install \
            toolchains:9 OpenHarmony/toolchains:9 --accept-license

          hvigorw_path="$(find "$tools_dir" -type f \( -name hvigorw -o -name hvigorw.sh \) -print -quit)"
          deveco_home="$(dirname "$(dirname "$(dirname "$(dirname "$hvigorw_path")")")")"
          sdk_home="$(dirname "$(dirname "$(dirname "$(find "$tools_dir" -type d -path '*/default/openharmony/toolchains' -print -quit)")")")"
          test -x "$deveco_home/tools/ohpm/bin/ohpm"
          test -x "$deveco_home/tools/hvigor/bin/hvigorw"
          test -x "$sdk_home/default/openharmony/toolchains/hdc"

          echo "DEVECO_HOME=$deveco_home" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$sdk_home" >> "$GITHUB_ENV"

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple API Issuer
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_TEXT: ${{ secrets.APPLE_API_KEY_TEXT }}
          # MacOS
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # iOS
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          # Android
          ANDROID_KEY_JKS: ${{ secrets.ANDROID_KEY_JKS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HARMONYOS_SIGNING_P12: ${{ secrets.HARMONYOS_SIGNING_P12 }}
          HARMONYOS_SIGNING_CER: ${{ secrets.HARMONYOS_SIGNING_CER }}
          HARMONYOS_SIGNING_P7B: ${{ secrets.HARMONYOS_SIGNING_P7B }}
          HARMONYOS_SIGNING_STORE_PASSWORD: ${{ secrets.HARMONYOS_SIGNING_STORE_PASSWORD }}
          HARMONYOS_SIGNING_KEY_PASSWORD: ${{ secrets.HARMONYOS_SIGNING_KEY_PASSWORD }}
        run: ${{ matrix.build }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/
          if-no-files-found: error

  release:
    needs:
      - build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download All Artifact
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Display Structure Of Downloaded Files
        run: ls -R
        working-directory: release

      - name: Generate Update File
        run: node scripts/update.js

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
